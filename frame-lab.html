<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XRZENO · card-frame lab</title>
<style>
  :root{ --nav:#0a1633; --cobalt:#1e40ff; --cob2:#6f8dff; --warm:#ff8a3d; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; background:
     radial-gradient(120% 90% at 50% -10%, #12213f 0%, #0a1633 55%, #070f26 100%) fixed;
     font-family:'Montserrat',system-ui,Segoe UI,sans-serif; color:#dfe6ff; }
  /* toolbar */
  #bar{ position:sticky; top:0; z-index:20; display:flex; gap:6px; flex-wrap:wrap; justify-content:center;
    padding:12px; background:rgba(10,18,42,.66); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(120,150,255,.18); }
  .btn{ font:600 12px/1 inherit; letter-spacing:.02em; color:#c7d3f5; cursor:pointer; padding:9px 13px;
    border:1px solid transparent; border-radius:8px; background:transparent; transition:.18s; }
  .btn:hover{ background:rgba(120,150,255,.12); }
  .btn.active{ background:var(--cobalt); color:#fff; border-color:rgba(255,255,255,.25); }
  #fx{ position:fixed; inset:0; pointer-events:none; z-index:5; opacity:0; transition:opacity .25s; }
  body[data-frame=emissive] #fx, body[data-frame=emissive2] #fx{ opacity:1; }
  #cap{ max-width:760px; margin:18px auto 0; text-align:center; font-size:12.5px; line-height:1.6; color:#aab8e6; padding:0 16px; }
  #cap b{ color:#eaf; } #cap .k{ color:var(--warm); }
  /* stage */
  #stage{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:34px;
    max-width:1080px; margin:34px auto; padding:10px 26px 90px; perspective:1100px; }
  .card{ position:relative; border-radius:16px; transform-style:preserve-3d; transition:transform .25s ease, box-shadow .25s ease;
    background:#0e1a3a; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .thumb{ position:relative; aspect-ratio:4/5; border-radius:inherit; overflow:hidden;
    background:radial-gradient(120% 85% at 50% 12%, #22325e 0%, #101c40 55%, #0b1430 100%); }
  .prod{ position:absolute; left:50%; top:52%; width:40%; height:62%; transform:translate(-50%,-50%);
    border-radius:46% 46% 48% 48% / 9% 9% 13% 13%;
    background:linear-gradient(118deg, #2c3d73 0%, #92a8e6 42%, #40548f 60%, #223056 100%);
    box-shadow:inset 0 6px 24px rgba(255,255,255,.18), inset 0 -20px 40px rgba(0,0,0,.4), 0 20px 40px rgba(0,0,0,.35); }
  .prod::after{ content:""; position:absolute; left:16%; top:8%; width:20%; height:66%; border-radius:40%;
    background:linear-gradient(#fff,rgba(255,255,255,0)); opacity:.5; filter:blur(2px); }
  .meta{ display:flex; justify-content:space-between; align-items:center; padding:12px 14px; font-size:12px; letter-spacing:.04em; color:#b9c6f0; }
  .meta .idx{ color:#6f83bf; font-variant-numeric:tabular-nums; }

  /* ===== overlays (present on every card; the active data-frame decides what shows) ===== */
  .frame{ position:absolute; inset:0; border-radius:inherit; pointer-events:none; }
  .corner{ position:absolute; width:22px; height:22px; opacity:0; transition:.28s cubic-bezier(.3,.9,.3,1); border:2px solid var(--cob2); }
  .corner.tl{ left:-6px; top:-6px; border-right:0; border-bottom:0; border-top-left-radius:6px; }
  .corner.tr{ right:-6px; top:-6px; border-left:0; border-bottom:0; border-top-right-radius:6px; }
  .corner.bl{ left:-6px; bottom:-6px; border-right:0; border-top:0; border-bottom-left-radius:6px; }
  .corner.br{ right:-6px; bottom:-6px; border-left:0; border-top:0; border-bottom-right-radius:6px; }
  .sheen{ position:absolute; inset:0; border-radius:inherit; padding:4px; opacity:0; transition:opacity .2s;
    background:radial-gradient(320px circle at var(--mx,50%) var(--my,50%), rgba(230,238,255,1) 0%, rgba(150,180,255,.98) 15%, rgba(255,138,61,.92) 36%, transparent 64%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite:exclude;
    filter:drop-shadow(0 0 8px rgba(160,190,255,.6)) drop-shadow(0 0 14px rgba(255,138,61,.35)); }
  .sweepbar{ position:absolute; inset:0; border-radius:inherit; opacity:0; overflow:hidden; }
  .sweepbar::before{ content:""; position:absolute; top:-20%; left:-40%; width:35%; height:140%; transform:rotate(8deg);
    background:linear-gradient(90deg,transparent,rgba(180,205,255,.55),rgba(255,255,255,.85),rgba(255,138,61,.5),transparent); }
  .wire{ position:absolute; inset:0; border-radius:inherit; opacity:0; mix-blend-mode:screen;
    background-image:linear-gradient(rgba(120,160,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(120,160,255,.5) 1px,transparent 1px);
    background-size:22px 22px; }
  .drawsvg{ position:absolute; inset:0; width:100%; height:100%; opacity:0; overflow:visible; }
  .drawsvg rect{ x:1px; y:1px; width:calc(100% - 2px); height:calc(100% - 2px); rx:16px; fill:none; stroke:var(--cob2); stroke-width:2;
    stroke-dasharray:var(--per,1400); stroke-dashoffset:var(--per,1400); transition:stroke-dashoffset .7s ease, stroke .3s; }

  /* ===== 1) AR RETICLE ===== */
  [data-frame=reticle] .corner{ opacity:.55; }
  [data-frame=reticle] .card:hover .corner{ opacity:1; border-color:var(--warm); }
  [data-frame=reticle] .card:hover .corner.tl{ transform:translate(4px,4px); }
  [data-frame=reticle] .card:hover .corner.tr{ transform:translate(-4px,4px); }
  [data-frame=reticle] .card:hover .corner.bl{ transform:translate(4px,-4px); }
  [data-frame=reticle] .card:hover .corner.br{ transform:translate(-4px,-4px); }

  /* ===== 2) DEPTH TILT ===== */
  [data-frame=tilt] .card{ transform:rotateX(var(--ry,0deg)) rotateY(var(--rx,0deg)); }
  [data-frame=tilt] .card:hover{ box-shadow:0 26px 60px rgba(0,0,0,.5); }
  [data-frame=tilt] .prod{ transition:transform .1s; transform:translate(calc(-50% + var(--px,0px)), calc(-50% + var(--py,0px))); }
  [data-frame=tilt] .card::after{ content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:radial-gradient(300px circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,.16), transparent 55%); }

  /* ===== 3) SCAN SWEEP ===== */
  [data-frame=sweep] .card:hover .sweepbar{ opacity:1; }
  [data-frame=sweep] .card:hover .sweepbar::before{ animation:sweep 1.1s ease-in-out; }
  [data-frame=sweep] .card:hover .wire{ opacity:.5; animation:wireflash 1.1s ease-in-out; }
  @keyframes sweep{ from{ left:-40%; } to{ left:120%; } }
  @keyframes wireflash{ 0%,100%{ opacity:0; } 50%{ opacity:.6; } }

  /* ===== 4) FROSTED BEVEL ===== */
  [data-frame=glass] .card{ box-shadow:0 10px 30px rgba(0,0,0,.4),
     inset 0 0 0 1px rgba(150,175,255,.28), inset 0 1px 0 rgba(255,255,255,.28), inset 0 -18px 40px rgba(0,0,0,.35); }
  [data-frame=glass] .thumb{ margin:7px; border-radius:12px; }
  [data-frame=glass] .thumb::after{ content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
     box-shadow:inset 0 0 0 1px rgba(180,200,255,.22), inset 0 2px 12px rgba(255,255,255,.12); }

  /* ===== 5) SPECULAR SHEEN ===== */
  [data-frame=sheen] .card:hover .sheen{ opacity:1; }
  [data-frame=sheen] .card{ box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 0 0 1px rgba(120,150,255,.18); }

  /* ===== 6) BORDER DRAW ===== */
  [data-frame=draw] .drawsvg{ opacity:1; }
  [data-frame=draw] .card:hover .drawsvg rect{ stroke-dashoffset:0; stroke:var(--warm); }
</style>
</head>
<body data-frame="reticle">
  <div id="bar">
    <button class="btn active" data-f="reticle">AR reticle</button>
    <button class="btn" data-f="tilt">Depth tilt</button>
    <button class="btn" data-f="sweep">Scan sweep</button>
    <button class="btn" data-f="glass">Frosted bevel</button>
    <button class="btn" data-f="sheen">Specular sheen</button>
    <button class="btn" data-f="draw">Border draw</button>
    <button class="btn" data-f="emissive">Emissive edge</button>
    <button class="btn" data-f="emissive2">Emissive · hover-lit</button>
  </div>
  <div id="cap"></div>
  <div id="stage"></div>
  <canvas id="fx"></canvas>


<script>
const TAU=Math.PI*2;
const cards=[['Shinobu · whisky','01'],['Atlas · fragrance','02'],['Nori · ceramic','03']];
const stage=document.getElementById('stage');
stage.innerHTML = cards.map(([tag,idx])=>`
  <article class="card">
    <div class="thumb"><div class="prod"></div>
      <span class="sweepbar"></span><span class="wire"></span>
    </div>
    <div class="meta"><span class="tag">${tag}</span><span class="idx">${idx}</span></div>
    <div class="frame">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <span class="sheen"></span>
      <svg class="drawsvg" preserveAspectRatio="none"><rect/></svg>
    </div>
  </article>`).join('');

// set the SVG dash perimeter per card size + per-card cursor vars (tilt / sheen / spotlight)
const cardEls=[...document.querySelectorAll('.card')];
function measure(){ cardEls.forEach(c=>{ const r=c.getBoundingClientRect();   // frame now wraps the whole card
  const per=2*(r.width+r.height); c.style.setProperty('--per', per.toFixed(0)); }); }
addEventListener('resize', measure); measure();

cardEls.forEach(c=>{
  c.addEventListener('pointermove', e=>{ const r=c.getBoundingClientRect();
    const px=(e.clientX-r.left)/r.width, py=(e.clientY-r.top)/r.height;   // 0..1
    c.style.setProperty('--mx', (px*100).toFixed(1)+'%'); c.style.setProperty('--my', (py*100).toFixed(1)+'%');
    c.style.setProperty('--rx', ((px-0.5)*14).toFixed(2)+'deg'); c.style.setProperty('--ry', (-(py-0.5)*14).toFixed(2)+'deg');
    c.style.setProperty('--px', ((px-0.5)*16).toFixed(1)+'px'); c.style.setProperty('--py', ((py-0.5)*16).toFixed(1)+'px');
  });
  c.addEventListener('pointerleave', ()=>{ c.style.setProperty('--rx','0deg'); c.style.setProperty('--ry','0deg');
    c.style.setProperty('--px','0px'); c.style.setProperty('--py','0px'); });
});

const CAP={
  reticle:'<b>AR reticle</b> — four viewfinder corners that <span class="k">lock on</span> when you hover (snap inward, cobalt → warm). Says "capture / AR" out loud; nothing else on the site does.',
  tilt:'<b>Depth tilt</b> — the card leans toward your cursor with a moving highlight + shadow. On the real site the image gets true parallax from the depth maps we already have.',
  sweep:'<b>Scan sweep</b> — hover and a light bar crosses the image, flashing a wireframe underneath. Scan → Rebuild in miniature, right on the card.',
  glass:'<b>Frosted bevel</b> — an inset glass edge that matches the buttons + drawer. The quiet, consistent option.',
  sheen:'<b>Specular sheen</b> — a hairline border with a bright specular spot that follows your cursor, cobalt into warm. Glass catching light.',
  draw:'<b>Border draw</b> — the frame traces itself in on hover, the same "printed" language as the strip wipes.',
  emissive:'<b>Emissive edge</b> — the border is built from glowing points like the tokonoma cloud (additive + bloom), and they <span class="k">magnetize</span> toward your cursor — the edge bulges and warms where you point, like the WhatsApp pill leaning. Move slowly along an edge.',
  emissive2:'<b>Emissive · hover-lit</b> — same real bloom, but hovering a card ignites its WHOLE border in cobalt light, and the cursor still <span class="k">magnetizes</span>: the edge bulges and goes warm-hot where you point.'
};
document.querySelectorAll('.btn').forEach(b=> b.addEventListener('click', ()=>{
  document.body.dataset.frame=b.dataset.f;
  document.querySelectorAll('.btn').forEach(x=>x.classList.toggle('active', x===b));
  document.getElementById('cap').innerHTML=CAP[b.dataset.f];
}));
document.getElementById('cap').innerHTML=CAP.reticle;

/* ===== EMISSIVE EDGE — bright perimeter points bloomed into REAL light: drawn to an offscreen buffer, then composited back at growing blur radii (additive) so hot cores overexpose and bleed, tokonoma-style. Magnetized toward the cursor. ===== */
const fx=document.getElementById('fx'), fctx=fx.getContext('2d');
const oc=document.createElement('canvas'), octx=oc.getContext('2d');
let FW,FH,FDPR;
function fxsize(){ FDPR=Math.min(devicePixelRatio||1,2); FW=innerWidth; FH=innerHeight;
  fx.width=oc.width=Math.round(FW*FDPR); fx.height=oc.height=Math.round(FH*FDPR);
  fx.style.width=FW+'px'; fx.style.height=FH+'px';
  fctx.setTransform(FDPR,0,0,FDPR,0,0); octx.setTransform(FDPR,0,0,FDPR,0,0); }
fxsize(); addEventListener('resize',fxsize);
let gmx=innerWidth/2, gmy=innerHeight/2, sx=gmx, sy=gmy;
addEventListener('pointermove', e=>{ gmx=e.clientX; gmy=e.clientY; });
function perim(r, gap){ const W=r.width,H=r.height, per=2*(W+H), n=Math.max(12,Math.round(per/gap)), out=[];
  for(let i=0;i<n;i++){ const d=(i/n)*per; let x,y;
    if(d<W){x=r.left+d;y=r.top;} else if(d<W+H){x=r.right;y=r.top+(d-W);}
    else if(d<2*W+H){x=r.right-(d-W-H);y=r.bottom;} else {x=r.left;y=r.bottom-(d-2*W-H);}
    out.push([x,y]); } return out; }
const R=185, MAXPULL=54;
const hov=cardEls.map(()=>0);   // per-card hover ease (0..1) — for the hover-lit mode
function fxloop(){
  const mode=document.body.dataset.frame;
  if(mode==='emissive' || mode==='emissive2'){
    sx+=(gmx-sx)*0.18; sy+=(gmy-sy)*0.18;
    // 1) bright points → offscreen (HDR: hot points clip past white so the bloom blazes)
    octx.clearRect(0,0,FW,FH); octx.globalCompositeOperation='lighter';
    octx.lineCap='round'; octx.lineJoin='round';
    cardEls.forEach((c,ci)=>{ const r=c.getBoundingClientRect();
      const inside = sx>=r.left-8 && sx<=r.right+8 && sy>=r.top-8 && sy<=r.bottom+8;
      hov[ci] += ((inside?1:0)-hov[ci])*0.15;
      const base = (mode==='emissive2') ? hov[ci]*0.8 : 0;   // emissive2: whole border lights on hover
      // displace each perimeter point by the magnet, carry its energy/warmth
      const pts=perim(r,7), N=pts.length, D=new Array(N);
      for(let i=0;i<N;i++){ let x=pts[i][0], y=pts[i][1];
        const dx=sx-x,dy=sy-y,d=Math.hypot(dx,dy)||1; let m=0;
        if(d<R){ m=1-d/R; const pull=m*m*MAXPULL; x+=dx/d*pull; y+=dy/d*pull; }
        D[i]={x,y,e:base+m*1.3,w:Math.min(1,m*1.3)}; }                 // e=energy (HDR), w=warmth
      // stroke the CLOSED path as short segments so it reads as one solid line with per-spot colour
      for(let i=0;i<N;i++){ const a=D[i], b=D[(i+1)%N], e=(a.e+b.e)*0.5;
        if(e<0.02) continue; const w=(a.w+b.w)*0.5;
        const rr=Math.round(80+w*175), gg=Math.round(130+w*30), bb=Math.round(255-w*185);
        octx.strokeStyle='rgba('+rr+','+gg+','+bb+','+Math.min(1,0.32+e).toFixed(3)+')';
        octx.lineWidth=1.8+e*3.2;
        octx.beginPath(); octx.moveTo(a.x,a.y); octx.lineTo(b.x,b.y); octx.stroke();
        if(e>0.7){ octx.strokeStyle='rgba(255,255,255,'+Math.min(1,(e-0.7)*1.2).toFixed(3)+')';   // white-hot core
          octx.lineWidth=1+e*1.5; octx.beginPath(); octx.moveTo(a.x,a.y); octx.lineTo(b.x,b.y); octx.stroke(); }
      }
    });
    octx.globalCompositeOperation='source-over';
    // 2) bloom = the same buffer stacked at growing blur radii, additively → light bleeds like the real thing
    fctx.clearRect(0,0,FW,FH); fctx.globalCompositeOperation='lighter';
    fctx.filter='none';       fctx.drawImage(oc,0,0,FW,FH);
    fctx.filter='blur(4px)';  fctx.drawImage(oc,0,0,FW,FH);
    fctx.filter='blur(12px)'; fctx.drawImage(oc,0,0,FW,FH);
    fctx.filter='blur(28px)'; fctx.globalAlpha=0.85; fctx.drawImage(oc,0,0,FW,FH);
    fctx.filter='none'; fctx.globalAlpha=1; fctx.globalCompositeOperation='source-over';
  }
  requestAnimationFrame(fxloop);
}
fxloop();
</script>
</body>
</html>
